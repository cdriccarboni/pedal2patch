name: Pedal2Patch Android

on:
  push:
    branches: ["main", "release/play"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: "Publier l'AAB sur Google Play"
        required: true
        type: boolean
        default: false
      track:
        description: "Track Google Play"
        required: true
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_status:
        description: "Statut de la release Play"
        required: true
        type: choice
        options: [draft, completed]
        default: draft
      version_code:
        description: "Version code Android (vide = 100000 + run_number)"
        required: false
        type: string
      version_name:
        description: "Version name Android (vide = package.json)"
        required: false
        type: string

jobs:
  debug:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run cap:prepare
      - run: npx cap add android
      - run: npx cap sync android
      - run: npm run android:configure
        env:
          ANDROID_VERSION_CODE: "1"
          ANDROID_VERSION_NAME: "debug"
          ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pedal2patch-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: github.ref == 'refs/heads/release/play' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_NAME: fr.cedriccarboni.pedal2patch
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install

      - name: Resolve Android version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          INPUT_CODE="${{ github.event.inputs.version_code }}"
          INPUT_NAME="${{ github.event.inputs.version_name }}"
          echo "code=${INPUT_CODE:-$((100000 + GITHUB_RUN_NUMBER))}" >> "$GITHUB_OUTPUT"
          echo "name=${INPUT_NAME:-$PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare Capacitor web bundle
        run: npm run cap:prepare
        env:
          ADMOB_BANNER_ID: ${{ env.ADMOB_BANNER_ID }}

      - run: npx cap add android
      - run: npx cap sync android

      - name: Configure Android metadata
        run: npm run android:configure
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ADMOB_APP_ID: ${{ env.ADMOB_APP_ID }}

      - name: Decode upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 manquant"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: pedal2patch-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.cedriccarboni.pedal2patch
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.release_status }}
