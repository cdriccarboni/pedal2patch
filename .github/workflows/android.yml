name: Pedal2Patch Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and verify PWA
        run: |
          npm install
          npm run check
          npm test
          npm run cap:prepare

      - name: Prepare Android wrapper
        run: |
          npx cap add android
          npx cap sync android
          VERSION="$(node -p "require('./package.json').version")"
          export VERSION
          python - <<'PY'
          import os, re
          from pathlib import Path
          version=os.environ["VERSION"]
          major,minor,patch=(int(x) for x in version.split(".")[:3])
          code=major*10000+minor*100+patch
          path=Path("android/app/build.gradle")
          text=path.read_text()
          text=re.sub(r'versionCode\s+\d+',f'versionCode {code}',text,count=1)
          text=re.sub(r'versionName\s+"[^"]+"',f'versionName "{version}"',text,count=1)
          path.write_text(text)
          print(f"Pedal2Patch versionName={version} versionCode={code}")
          PY

      - name: Build APK test and unsigned AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Pedal2Patch-Android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION-test"
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK_SRC" "/tmp/Pedal2Patch-$VERSION-TEST.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/Pedal2Patch-$VERSION-TEST.apk" --clobber
          else
            gh release create "$TAG"               "/tmp/Pedal2Patch-$VERSION-TEST.apk"               --prerelease               --title "Pedal2Patch $VERSION — Android TEST"               --notes "APK de test produit après syntax check, tests et build Capacitor. AAB non signé compilé mais non diffusé publiquement."
          fi
