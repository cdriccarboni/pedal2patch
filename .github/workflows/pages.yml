name: Pedal2Patch Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon-192.svg"
      - "icon-512.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pedal2patch-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css manifest.webmanifest sw.js icon-192.svg icon-512.svg _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
